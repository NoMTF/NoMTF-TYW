name = "nomtf-tyw"
main = "src/permanent-worker.ts"
compatibility_date = "2026-10-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[triggers]
crons = ["0 * * * *", "*/5 * * * *"]

[vars]
LIQUIDITY_MODE = "auto"
LIQUIDITY_ENABLED = "true"
LIQUIDITY_CONTROLLER_CODE_HASH = "0xebf16b8f13ccb09360f88fe64398137dce7bfa66ced074243b358ca96c41c0b0"
LIQUIDITY_CONTROLLER = "0x913591050C1f9047f4B825697D3A2302D7F82D8b"
RPC_URL = "https://bsc-dataseed.bnbchain.org"
CHAIN_ID = "56"
VAULT_ADDRESS = "0xaE7eA21fBf3613fFc17fe962EE66bfe03015fBa7"
EXECUTION_MODE = "monitor"
PRICE_MAX_AGE_SECONDS = "120"
ORDER_DEADLINE_SECONDS = "86400"
COST_TARGET_BPS = "100"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "PortfolioCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PortfolioCoordinator"]
